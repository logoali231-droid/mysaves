
[Validation]
	#Allow use of the mod for players that are in survival mode. Otherwise, only creative mode players can use the mod.
	allowInSurvival = true
	#Use a whitelist to determine which players can use the mod. If false, all players can use the mod.
	useWhitelist = false
	#List of player names that can use the mod.
	whitelist = ["Player1", "Player2"]
	#Maximum number of blocks that can be placed at once. This is a last check. If you want the player to receive visual feedback instead of an error message, change values in the common config.
	#Range: 1 ~ 100000
	maxBlocksPlacedAtOnce = 10000

[Memory]
	#How many sets of blocks are remembered for the undo functionality, per player.
	#Range: 10 ~ 200
	undoStackSize = 50

[SurvivalBreaking]
	#Allow build-mode mass breaking for survival players (creative players can always use it).
	enabled = true
	#Skip a candidate tool once it has 1 use left, so the mod never breaks your tool.
	stopBeforeToolBreaks = true
	#Maximum mining delay (in ticks) for one survival break operation.
	#Range: 0 ~ 1200
	maxDelayTicks = 40
	#Hunger exhaustion applied per block broken in survival, like vanilla mining.
	#Range: 0.0 ~ 1.0
	exhaustionPerBlock = 0.005

[SurvivalReplace]
	#Allow survival players to use the replace modes of the radial menu (replace blocks and air / only blocks / filtered by offhand) and Quick Replace. Replaced blocks are mined like survival breaking: the right tool is used and loses durability, drops go to the inventory, protected and unbreakable blocks are skipped, and the mining delay applies.
	enabled = false


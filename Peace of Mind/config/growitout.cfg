# Configuration file

general {

    client {
        B:"Show particles"=true
    }

    core {
        # To disallow crops from having effect. (Case Sensitive)
        S:Blacklists <
            minecraft:grass
            minecraft:tallgrass
         >

        # The chance of twerk occuring.
        # Min: 0
        # Max: 100
        I:Chance=25

        # Globally enable or disable twerk
        B:"Enable twerk"=true

        # Instant grow crop blocks. Note: this does not affect stuff like saplings
        B:"Instant grow"=false

        # Use blacklist as whitelist.
        B:"Invert blacklist"=false

        # Range of twerk having effects. over 8 is not recommended
        # Min: 1
        # Max: 64
        I:Radius=3
    }

    "mystical agriculture" {
        # Mystical Agriculture crops to have affect
        B:"Enable Mystical Agriculture"=true

        # Instant grow Mystical Agriculture crops
        B:"Instant grow"=false
    }

    agricraft {
        # AgriCraft crops to have affect
        B:"Enable AgriCraft"=true

        # Instant grow AgriCraft crops
        B:"Instant grow"=false
    }

    ic2 {
        # Allow IC2 crops to have effects
        B:"Enable IC2"=true

        # Grow method for IC2, Enabling Instant grow ignores this.
        # PERFORM_TICK will perform the IC2 typical growth function with checking for humidity and more
        # PERFORM_GROWTH_TICK will perform a custom method to PERFORM_TICK but doesn't check for humidity and more
        # Valid values:
        # PERFORM_TICK
        # PERFORM_GROWTH_TICK
        S:"IC2 grow method"=PERFORM_TICK

        # Instant grow IC2 crops
        B:"Instant grow"=false
    }

}



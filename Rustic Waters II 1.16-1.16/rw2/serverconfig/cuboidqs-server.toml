
#Quantum Collapser Settings
[collapsers]

	[collapsers.recipe]
		# The base number of ticks to use for collapsing recipes.
		# 600 means it takes 30 seconds (20 ticks per second).
		# Default: 600
		#Range: 1 ~ 72000
		defaultTicks = 600
		# The default number of items required for collapsing recipes.
		# 640 means it takes 10 stacks (640 items).
		# Default: 640
		#Range: 1 ~ 50000
		defaultCount = 640

	[collapsers.speed]
		# Speed at which the collapser works.
		# 1.0 means the collapser runs at normal speed according to the recipe being used.
		# Default: 1.0
		#Range: 1.0 ~ 20.0
		iron = 1.0
		# Speed at which the collapser works.
		# 1.2 means the collapser runs 20% faster than the recipe being used specifies (e.g. 200 / 1.2 = 167 ticks).
		# Default: 1.2
		#Range: 1.0 ~ 20.0
		gold = 1.2000000476837158
		# Speed at which the collapser works.
		# 1.5 means the collapser runs 50% faster than the recipe being used specifies (e.g. 200 / 1.5 = 133 ticks).
		# Default: 1.5
		#Range: 1.0 ~ 20.0
		diamond = 1.5
		# Speed at which the collapser works.
		# 2.5 means the collapser runs 150% faster than the recipe being used specifies (e.g. 200 / 2.5 = 80 ticks).
		# Default: 2.5
		#Range: 1.0 ~ 20.0
		emerald = 2.5
		# Speed at which the collapser works.
		# 5.0 means the collapser runs 400% faster than the recipe being used specifies (e.g. 200 / 5.0 = 40 ticks).
		# Default: 5.0
		#Range: 1.0 ~ 20.0
		netherite = 5.0

#JEI Settings
[jei]
	# Enable or disable the JeiPlugin of Cuboid machines.
	enable_jei = true
	# Enable or disable the Catalysts in Jei for Cuboid machines.
	enable_jei_catalysts = true
	# Enable or disable the Click Area inside the GUI in all Cuboid machines.
	enable_jei_click_area = true

#Misc
[misc]
	# Logs additional information when loading Quantum Singularity config files.
	verbose_logging = false

